<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 420 420">
  <!-- outer-circle-animation: fill 纯白 -->
  <circle id="outer" cx="200" cy="200" r="200" fill="#ffffff"/>
  <!-- inner-circle-animation: fill none -->
  <circle id="inner" cx="200" cy="200" r="130" fill="none"/>
  <!-- decorative-path-animation: 虚线圆与 inner 一致，中心 (200,200) 半径 130 -->
  <circle
    id="decorative"
    cx="200"
    cy="200"
    r="130"
    fill="none"
    stroke="#9ca3af"
    stroke-width="21.8856"
    stroke-dasharray="0.51 5.09"
  />
  <!-- network-node-animation node-1..6 -->
  <circle class="node" cx="200" cy="100" r="15" fill="#e5e7eb"/>
  <circle class="node" cx="287" cy="150" r="15" fill="#e5e7eb"/>
  <circle class="node" cx="287" cy="250" r="15" fill="#e5e7eb"/>
  <circle class="node" cx="200" cy="300" r="15" fill="#e5e7eb"/>
  <circle class="node" cx="113" cy="250" r="15" fill="#e5e7eb"/>
  <circle class="node" cx="113" cy="150" r="15" fill="#e5e7eb"/>
  <!-- connection-line-animation -->
  <line x1="200" y1="200" x2="200" y2="90" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="200" y1="200" x2="295" y2="145" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="200" y1="200" x2="295" y2="255" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="310" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="200" y1="200" x2="105" y2="255" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="200" y1="200" x2="105" y2="145" stroke="#e5e7eb" stroke-width="2"/>
  <!-- center-node-animation -->
  <circle id="center" cx="200" cy="200" r="25" fill="#9ca3af"/>
</svg>
